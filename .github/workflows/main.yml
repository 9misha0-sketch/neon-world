name: Build NEON WORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEON WORLD
        run: |
          rm -rf app
          mkdir app
          unzip -o NEON_WORLD_v0.5_connected.zip -d app
          test -f app/world_live_chat_mvp/pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Flutter code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/world_live_chat_mvp")

          # Fix LiveKit service null safety
          p = root / "lib/services/livekit_service.dart"
          s = p.read_text()

          s = s.replace(
              "r.localParticipant.setCameraEnabled(",
              "r.localParticipant?.setCameraEnabled("
          )

          s = s.replace(
              "r.localParticipant.setMicrophoneEnabled(",
              "r.localParticipant?.setMicrophoneEnabled("
          )

          s = s.replace(
              "room?.localParticipant.setCameraEnabled(",
              "room?.localParticipant?.setCameraEnabled("
          )

          s = s.replace(
              "room?.localParticipant.setMicrophoneEnabled(",
              "room?.localParticipant?.setMicrophoneEnabled("
          )

          p.write_text(s)

          # Fix nullable profile map in home_screen.dart
          p = root / "lib/screens/home_screen.dart"
          s = p.read_text()

          s = s.replace("p[", "p?[")

          p.write_text(s)

          # Fix nullable LiveKit localParticipant in video screen
          p = root / "lib/screens/video_chat_screen.dart"
          s = p.read_text()

          s = s.replace(
              "r.localParticipant.videoTrackPublications",
              "r.localParticipant!.videoTrackPublications"
          )

          p.write_text(s)

          print("Automatic fixes completed")
          PY

      - name: Create Android platform
        working-directory: app/world_live_chat_mvp
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.neonworld .
          fi

      - name: Install dependencies
        working-directory: app/world_live_chat_mvp
        run: flutter pub get

      - name: Analyze
        working-directory: app/world_live_chat_mvp
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        working-directory: app/world_live_chat_mvp
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f app/world_live_chat_mvp/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-WORLD-Android-Fixed
          path: app/world_live_chat_mvp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build APK
        working-directory: app/world_live_chat_mvp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-WORLD-Android-Fixed
          path: app/world_live_chat_mvp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
