name: Build NEON BET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'neon-bet-app/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        working-directory: neon-bet-app
        run: flutter create --platforms=android --org com.neonbet .

      - name: Set app name and Internet permission
        working-directory: neon-bet-app
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="NEON BET"/' "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Install dependencies
        working-directory: neon-bet-app
        run: flutter pub get

      - name: Build release APK
        working-directory: neon-bet-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-BET-Android-APK
          path: neon-bet-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
