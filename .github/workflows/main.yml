name: Build NEON WORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEON WORLD
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "NEON_WORLD_v0.5_FIXED.zip" -d extracted
          echo "ZIP extracted"
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --org com.neonworld .

      - name: Add Android permissions
        working-directory: ${{ env.PROJECT_DIR }}
